name: Build WebtoonFold

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: '25'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # compileSdk / build-tools versions are defined in app/build.gradle.kts
          packages: 'platforms;android-35 build-tools;36.0.0'

      - name: Ensure Gradle wrapper exists
        # The wrapper jar is not committed; generate it on the fly so `./gradlew` works.
        run: |
          if [ ! -f gradlew ]; then
          curl -sL https://services.gradle.org/distributions/gradle-9.4.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-9.4.1/bin/gradle wrapper --gradle-version 9.4.1
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: webtoon-fold-apk
          path: app/build/outputs/apk/release/*.apk
